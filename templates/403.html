<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied (403) - PayEase</title>
    
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-auth d-flex align-items-center justify-content-center min-vh-100">

    <div class="auth-container p-4 text-center">
        <div class="stat-icon bg-danger-light text-danger mx-auto mb-4" style="width: 80px; height: 80px; font-size: 36px;">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="display-4 fw-bold text-danger mb-2">403</h1>
        <h3 class="fw-bold mb-2">Access Denied</h3>
        <p class="text-muted text-sm mb-4">You do not have the required administrative clearance to access this system module.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2 shadow-sm fw-medium">
                <i class="bi bi-house-door me-2"></i> Dashboard
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary px-4 py-2 fw-medium">
                <i class="bi bi-arrow-left me-2"></i> Go Back
            </button>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
